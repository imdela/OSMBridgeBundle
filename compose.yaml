services:
  # Reference PHP service to show how to link with OpenSign
  opensignb-php:
    image: php:8.4-cli-alpine
    container_name: opensignb-php
    working_dir: /app
    command: tail -f /dev/null
    env_file:
      - .env.dist
    volumes:
      - ./:/app
    networks:
      - opensignb-net

  opensignb-minio:
    image: ghcr.io/imdela/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: opensignb-minio
    environment:
      MINIO_ENDPOINT: "http://localhost:9000"
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    ports:
      - "9006:9001"  # console Web UI
      - "9005:9000"  # S3 API
    networks:
      opensignb-net:
        aliases:
          - minio
          - opensignb.minio # Critical for virtual hosting style
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: ghcr.io/imdela/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: opensignb-minio-init
    depends_on:
      opensignb-minio:
        condition: service_healthy
    networks:
      - opensignb-net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 admin admin123;
      mc mb myminio/osmb --ignore-existing;
      mc admin user add myminio PejF8wMFAWF05hvteQqZ PeC2LtCO38Noenh6w1JCpcjiZPj31sQBfBwpgIij || true;
      mc admin policy attach myminio readwrite --user PejF8wMFAWF05hvteQqZ || true;
      exit 0;
      "

  opensignb-mongodb:
    image: mongo:8.2.5
    container_name: opensignb-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - mongodb_data:/data/db
    networks:
      - opensignb-net

  opensign:
    image: opensign/opensignserver:main
    container_name: opensignb-opensign
    ports:
      - "3005:8080"
    volumes:
      - ./resources/scripts/opensign-minio-patch.js:/usr/src/app/index.js
    environment:
      NODE_ENV: development
      PORT: "8080"
      USE_LOCAL: "false"
      APP_ID: opensign
      MASTER_KEY: dev-master-key
      SERVER_URL: http://opensign:8080/app
      PUBLIC_SERVER_URL: http://localhost:3005/app
      DATABASE_URI: mongodb://root:rootpass@opensignb-mongodb:27017/opensign?authSource=admin
      MONGODB_URI: mongodb://root:rootpass@opensignb-mongodb:27017/opensign?authSource=admin
      DO_ENDPOINT: http://minio:9000
      DO_SPACE: osmb
      DO_BASEURL: http://localhost:9000/osmb
      DO_REGION: us-east-1
      DO_ACCESS_KEY_ID: PejF8wMFAWF05hvteQqZ
      DO_SECRET_ACCESS_KEY: PeC2LtCO38Noenh6w1JCpcjiZPj31sQBfBwpgIij
    depends_on:
      - opensignb-mongodb
      - opensignb-minio
    networks:
      - opensignb-net

  opensign-ui:
    image: opensign/opensign:main
    container_name: opensignb-opensign-ui
    environment:
      - PUBLIC_URL=http://localhost:3006
      - REACT_APP_SERVERURL=http://localhost:3005/app
      - REACT_APP_APPID=opensign
      - REACT_APP_ALLOW_REGISTRATION=true
    command: npm start
    ports:
      - "3006:3000"
    depends_on:
      - opensign
    networks:
      - opensignb-net

networks:
  opensignb-net:

volumes:
  minio_data:
  mongodb_data:
